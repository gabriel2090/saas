# Instalador de Windows (Fase 6b: D-176, D-177, D-178, D-187, D-189, D-190).
appId: co.negocio.inventario-facturacion
productName: Inventario y Facturación
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# better-sqlite3 13 trae binarios N-API precompilados válidos para Electron: no se recompila (D-10).
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Inventario y Facturación
  installerLanguages:
    - es_ES
  include: instalador.nsh
  unicode: true
  warningsAsErrors: true
